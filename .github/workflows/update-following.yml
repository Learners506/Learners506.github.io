name: Update followed blogs

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch recent articles
        run: node scripts/update-following.mjs
      - name: Save updates
        run: |
          if git diff --quiet -- data/following.json; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/following.json
          git commit -m "Update followed blog articles"
          git push
